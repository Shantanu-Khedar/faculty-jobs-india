name: Daily notice check

# Reads every source in sources.json that GitHub's servers can reach.
# Sources marked "runOn": "india" are read by india.yml on a computer in India.

on:
  schedule:
    - cron: "17 1 * * *"   # every day at 06:47 IST
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: notice-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools for reading PDFs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr > /dev/null
          pip install -q requests
      - name: Check official pages and read new notices
        env:
          TIME_BUDGET_SECONDS: "5400"
          READ_WORKERS: "24"
        run: python check_notices.py --group main
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notices.json
          git diff --staged --quiet || (git commit -m "Daily notice check $(date -u +%F)" && git pull --rebase -q && git push)
